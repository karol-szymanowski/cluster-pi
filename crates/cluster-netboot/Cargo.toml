[package]
name = "cluster-netboot"
version = "0.1.0"
edition = "2021"
authors = ["Pi Cluster Core Authors"]
description = "PXE, ProxyDHCP, TFTP, and HTTP Netboot engine for Raspberry Pi ARM64 cluster"

[dependencies]
cluster-common = { workspace = true }

# Async & Networking
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
dhcproto = { workspace = true }

# HTTP & Web
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Kubernetes
kube = { workspace = true }
k8s-openapi = { workspace = true }

# Serialization & Concurrency
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }

# CLI & Logging
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
