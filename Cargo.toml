[workspace]
resolver = "2"
members = [
    "crates/cluster-common",
    "crates/cluster-ldm",
    "crates/cluster-netboot",
    "crates/cluster-operator",
    "tests/chaos",
    "tests/netns",
]

[workspace.dependencies]
# Async & Runtime
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"

# gRPC & Protobuf
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost", "channel", "router", "server"] }
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

# Kubernetes & CRD
kube = { version = "0.98", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "0.24", features = ["v1_30", "schemars"] }
schemars = { version = "0.8", features = ["chrono"] }

# HTTP & Web
axum = { version = "0.8", features = ["tokio", "http1", "http2"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }

# DHCP & Networking
dhcproto = "0.13"

# Concurrency & Collections
bytes = "1.9"
dashmap = "6.1"
parking_lot = "0.12"
uuid = { version = "1.12", features = ["v4", "serde"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env"] }

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Testing & Utilities
tempfile = "3.16"
nix = { version = "0.29", features = ["fs", "mount", "sched", "net", "signal", "socket"] }

# Internal Workspace Crates
cluster-common = { path = "crates/cluster-common" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
