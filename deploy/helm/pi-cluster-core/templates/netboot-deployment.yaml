{{- if .Values.netboot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pi-cluster-core.fullname" . }}-netboot
  namespace: {{ .Values.global.namespace }}
  labels:
    app: cluster-netboot
    {{- include "pi-cluster-core.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.netboot.replicaCount }}
  selector:
    matchLabels:
      app: cluster-netboot
  template:
    metadata:
      labels:
        app: cluster-netboot
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: netboot
          image: "{{ .Values.netboot.image.repository }}:{{ .Values.netboot.image.tag }}"
          imagePullPolicy: {{ .Values.netboot.image.pullPolicy }}
          env:
            - name: CLUSTER_VIP
              value: {{ .Values.global.clusterVip | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K3S_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.netboot.k3sTokenSecret }}
                  key: token
                  optional: true
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - NET_BIND_SERVICE
          volumeMounts:
            - name: gfs-assets
              mountPath: /mnt/gfs/netboot-assets
            - name: local-cache
              mountPath: /var/lib/cluster-netboot/assets
      volumes:
        - name: gfs-assets
          hostPath:
            path: {{ .Values.netboot.gfsAssetPath | quote }}
            type: DirectoryOrCreate
        - name: local-cache
          emptyDir: {}
{{- end }}
