{{- if .Values.kubeVip.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "pi-cluster-core.fullname" . }}-kube-vip
  namespace: {{ .Values.global.namespace }}
  labels:
    app: kube-vip
    {{- include "pi-cluster-core.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: kube-vip
  template:
    metadata:
      labels:
        app: kube-vip
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: Exists
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      hostNetwork: true
      serviceAccountName: {{ include "pi-cluster-core.fullname" . }}-kube-vip
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      containers:
        - name: kube-vip
          image: "{{ .Values.kubeVip.image.repository }}:{{ .Values.kubeVip.image.tag }}"
          imagePullPolicy: {{ .Values.kubeVip.image.pullPolicy }}
          args:
            - manager
          env:
            - name: vip_arp
              value: "true"
            - name: port
              value: "6443"
            - name: vip_interface
              value: {{ .Values.kubeVip.interface | quote }}
            - name: vip_cidr
              value: {{ .Values.kubeVip.cidr | quote }}
            - name: cp_enable
              value: "true"
            - name: cp_namespace
              value: {{ .Values.global.namespace | quote }}
            - name: vip_leaderelection
              value: "true"
            - name: vip_leasename
              value: {{ .Values.kubeVip.leaseName | quote }}
            - name: address
              value: {{ .Values.global.clusterVip | quote }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
{{- end }}
