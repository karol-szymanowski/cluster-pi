{{- if .Values.kubeVip.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pi-cluster-core.fullname" . }}-kube-vip
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "pi-cluster-core.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pi-cluster-core.fullname" . }}-kube-vip-role
  labels:
    {{- include "pi-cluster-core.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services", "services/status", "nodes", "endpoints"]
    verbs: ["list", "get", "watch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["list", "get", "watch", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pi-cluster-core.fullname" . }}-kube-vip-binding
  labels:
    {{- include "pi-cluster-core.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pi-cluster-core.fullname" . }}-kube-vip-role
subjects:
  - kind: ServiceAccount
    name: {{ include "pi-cluster-core.fullname" . }}-kube-vip
    namespace: {{ .Values.global.namespace }}
{{- end }}
