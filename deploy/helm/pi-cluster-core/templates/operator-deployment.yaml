{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pi-cluster-core.fullname" . }}-operator
  namespace: {{ .Values.global.namespace }}
  labels:
    app: cluster-operator
    {{- include "pi-cluster-core.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app: cluster-operator
  template:
    metadata:
      labels:
        app: cluster-operator
    spec:
      serviceAccountName: {{ include "pi-cluster-core.fullname" . }}-operator
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GFS_MASTER_ENDPOINT
              value: {{ .Values.operator.gfsMasterEndpoint | quote }}
            - name: ETCD_ENDPOINT
              value: {{ .Values.operator.etcdEndpoint | quote }}
          volumeMounts:
            - name: etcd-certs
              mountPath: /var/lib/rancher/k3s/server/tls/etcd
              readOnly: true
      volumes:
        - name: etcd-certs
          hostPath:
            path: /var/lib/rancher/k3s/server/tls/etcd
            type: DirectoryOrCreate
{{- end }}
